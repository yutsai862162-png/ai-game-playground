name: Game and family integration checks
on:
  push:
    branches: [gpt/hero-art-integration, gpt/family-integration]
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/check-hero-integration.yml'
  pull_request:
    branches: [main, gpt/hero-art-integration, gpt/family-integration]
    paths:
      - 'game/**'
      - 'tests/**'
      - '.github/workflows/check-hero-integration.yml'
permissions:
  contents: read
concurrency:
  group: hero-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.56.1', '1.57.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and protect approved gameplay contracts
        run: |
          for file in game/*.js tests/*.cjs; do node --check "$file"; done
          node tests/protected-contracts.cjs --self-test
          node tests/family-assets.cjs
      - name: Install browser test dependency outside repository
        id: browsers
        run: |
          mkdir -p "$RUNNER_TEMP/hero-qa"
          cd "$RUNNER_TEMP/hero-qa"
          npm install --no-save --package-lock=false "playwright@${{ matrix.playwright }}"
          npx playwright install --with-deps chromium webkit
      - name: Test actual game with browser process diagnostics
        id: integration
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
          DEBUG: pw:browser
        run: |
          mkdir -p qa-results
          set -o pipefail
          timeout 300s node tests/hero-integration.cjs 2>&1 | tee qa-results/browser-process.log
      - name: Check walk geometry even if the full route fails
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
        run: timeout 180s node tests/hero-walk-geometry.cjs
      - name: Check original family assets, display and fallback
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
        run: timeout 180s node tests/family-browser.cjs
      - name: Check mobile controls and dialogue layout
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
        run: timeout 180s node tests/mobile-layout.cjs
      - name: Check continuous drag, jitter and multi-touch ownership
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
        run: timeout 120s node tests/touch-drag.cjs
      - name: Compare minimal and game viewport rotation
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        env:
          NODE_PATH: ${{ runner.temp }}/hero-qa/node_modules
        run: timeout 120s node tests/viewport-diagnostics.cjs
      - name: Capture kernel and memory diagnostics
        if: always()
        run: |
          mkdir -p qa-results
          sudo dmesg --ctime | tail -n 120 | tee qa-results/kernel.log || true
          free -m > qa-results/memory.txt
          df -h /dev/shm >> qa-results/memory.txt
          cat /sys/fs/cgroup/memory.events >> qa-results/memory.txt 2>/dev/null || true
      - name: Archive evidence and tested source
        if: always()
        run: |
          mkdir -p qa-results
          git rev-parse HEAD > qa-results/source-commit.txt
          tar -czf qa-results/tested-game-source.tar.gz game tests
          if [ -n "${HERO_QA_GAME_ROOT:-}" ]; then
            tar -czf qa-results/served-baseline-game.tar.gz -C "$HERO_QA_GAME_ROOT" game
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-integration-evidence-${{ matrix.playwright }}
          path: qa-results/
          retention-days: 7
