<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><style>body{margin:0;position:fixed;top:env(safe-area-inset-top,0);bottom:env(safe-area-inset-bottom,0);left:0;right:0;height:auto!important}[hidden]{display:none!important}</style></head><body>
<title>小公主的放學路</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;800&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, a single framed street stage below; every menu and dialogue is a sheet inside the stage. */
:root{
  color-scheme: light;
  --sky:#bfe6f5; --paper:#fff9ef; --ink:#3b2a4d; --ink-soft:#7a6a8c;
  --lav:#b9a4ea; --pink:#ff8fb3; --orange:#ff8a3d; --mint:#7fd3bb; --sun:#ffcf4a;
  --line:#3b2a4d; --off:#f1ece2;
  --display:"LXGW WenKai TC","PingFang TC","Microsoft JhengHei",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
html,body{height:100%;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);font-size:15px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:900px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button:disabled{cursor:default}

.hud{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{color:var(--orange)}
.chip.warn{background:var(--pink)}
.chip.hi{background:var(--sun)}
#mname{font-family:var(--display);font-weight:700;font-size:16px;margin-right:auto}
.prog{flex-basis:100%;height:12px;background:var(--paper);border:2px solid var(--line);border-radius:999px;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(-45deg,var(--lav) 0 8px,var(--pink) 8px 16px)}

#stage{flex:1;min-height:0;position:relative;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:var(--sky);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;display:flex;flex-direction:column}

#title h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,8.5vw,56px);line-height:1.05;margin:16px 18px 0;text-wrap:balance;
  color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.02em}
#title .tag{margin:8px 20px 0;font-weight:800;font-size:14px;background:var(--sun);border:2px solid var(--line);border-radius:999px;padding:2px 12px;align-self:flex-start;transform:rotate(-2deg)}
.sheet{margin-top:auto;background:var(--paper);border-top:3px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.two{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:1px;min-width:0}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mcard strong{font-family:var(--display);font-size:clamp(16px,4.6vw,20px);white-space:nowrap}
.mcard span{font-size:12.5px;color:var(--ink-soft);font-weight:500}
.mcard em{font-style:normal;font-size:13px;color:var(--orange);font-weight:800}
.mcard.a{background:#f1ebff}.mcard.b{background:#ffeef3}.mcard.c{background:#e6f5ec}
#camp{pointer-events:none;justify-content:space-between}
#camp>*{pointer-events:auto}
.ctop{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.csheet{max-height:47%;border-top:3px solid var(--line);display:flex;flex-direction:column}
.csheet .row .btn{padding:6px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--sun);border:3px solid var(--line);border-radius:14px;padding:7px 14px;font-weight:800;box-shadow:0 4px 0 var(--line);position:relative}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.alt{background:#fff}
.btn.dot::after{content:"";position:absolute;top:-6px;right:-6px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--line)}
.hint{font-size:12.5px;color:var(--ink-soft);font-weight:500}

#dialog{justify-content:flex-end;padding:12px;pointer-events:none}
.dbox{pointer-events:auto;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:22px 16px 14px;position:relative;box-shadow:0 5px 0 var(--line);min-height:92px}
.dname{position:absolute;top:-16px;left:14px;background:var(--lav);border:3px solid var(--line);border-radius:10px;padding:1px 12px;font-weight:800;font-size:14px}
.dtext{font-family:var(--display);font-size:19px;line-height:1.5;min-height:2.9em}
.dnext{position:absolute;right:14px;bottom:8px;font-size:12px;color:var(--ink-soft);animation:bop 1s infinite}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.choices button{text-align:left;background:#fff;border:3px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.choices button:first-child{background:#dff5ee}
.choices button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@keyframes bop{50%{transform:translateY(3px)}}

#tap{align-items:center;justify-content:center;gap:12px;background:rgba(59,42,77,.55);padding:16px;text-align:center}
#tap .food{font-size:74px;line-height:1;animation:wob .5s infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
#tap h2{font-family:var(--display);color:var(--paper);font-size:26px;margin:0}
.bar{width:min(300px,100%);height:20px;background:var(--paper);border:3px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint)}
.bar.time i{background:var(--pink);width:100%}
#tapbtn{width:150px;height:150px;border-radius:50%;background:var(--sun);border:4px solid var(--line);box-shadow:0 8px 0 var(--line);font-family:var(--display);font-weight:700;font-size:34px;touch-action:manipulation}
#tapbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--line)}
#tap p{color:var(--paper);font-weight:800;margin:0}
#quiz{align-items:center;justify-content:center;gap:14px;background:rgba(59,42,77,.6);padding:18px;text-align:center}
#quiz h2{font-family:var(--display);color:var(--paper);font-size:23px;line-height:1.4;margin:0;max-width:20em;text-wrap:balance}
#qshow{font-size:44px;line-height:1.2;letter-spacing:.1em;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:8px 16px}
#quiz .choices{width:min(320px,100%);margin:0}
#quiz .choices button{text-align:center;font-size:18px;padding:12px}
#quiz .choices button:first-child{background:#fff}
#qtrack{position:relative;width:min(300px,100%);height:34px;background:var(--paper);border:3px solid var(--line);border-radius:12px;overflow:hidden}
#qzone{position:absolute;top:0;bottom:0;background:var(--mint)}
#qptr{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--ink);border-radius:4px}

.panel{background:var(--paper);overflow:auto;padding:14px;gap:12px;touch-action:pan-y}
.panel h2{font-family:var(--display);font-size:26px;margin:0}
.panel h3{margin:6px 0 0;font-size:13px;letter-spacing:.12em;color:var(--ink-soft)}
.phead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.phead h2{margin-right:auto}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lv .no{font-size:12px;font-weight:800;color:var(--ink-soft)}
.lv strong{font-family:var(--display);font-size:18px;line-height:1.2}
.lv span{font-size:12px;color:var(--ink-soft);font-weight:500}
.lv .fl{color:var(--pink);letter-spacing:.1em;font-size:16px}
.lv .fl s{text-decoration:none;color:#e3d9c8}
.lv.lock{background:var(--off);box-shadow:none}
.lv.lock strong{color:var(--ink-soft)}
.lv.boss{background:#f1ebff}
.wtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#pv{width:150px;height:170px;background:var(--sky);border:3px solid var(--line);border-radius:16px;flex:none}
.wtop .info{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.item{background:#fff;border:3px solid var(--line);border-radius:12px;padding:7px 6px;font-weight:800;font-size:13.5px;display:flex;flex-direction:column;gap:1px;align-items:center;text-align:center}
.item small{font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.item.on{background:var(--lav)}.item.on small{color:var(--ink)}
.item.lock{background:var(--off)}
.no-go{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.list{display:flex;flex-direction:column;gap:8px}
.line{display:flex;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 10px}
.line .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.line .tx b{font-size:14px}.line .tx span{font-size:12px;color:var(--ink-soft);font-weight:500}
.line .btn{padding:4px 10px;font-size:13px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.line .btn:disabled{background:var(--off);box-shadow:none;color:var(--ink-soft)}
.pips{letter-spacing:.15em;color:var(--orange)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.badge{background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.badge i{font-style:normal;font-size:28px;line-height:1.1}
.badge b{font-size:13px}.badge span{font-size:11px;color:var(--ink-soft);font-weight:500}
.badge.off{background:var(--off)}.badge.off i{filter:grayscale(1);opacity:.35}
#result{align-items:center;justify-content:center;text-align:center}
#result .rate{font-size:44px;letter-spacing:.12em;color:var(--pink);line-height:1}
#result .rate s{text-decoration:none;color:#e3d9c8}
#result p{margin:0;font-family:var(--display);font-size:18px;line-height:1.5;max-width:26em}
#rending{font-family:var(--display);font-weight:700;background:var(--sun);border:3px solid var(--line);border-radius:12px;padding:4px 14px;transform:rotate(-1.5deg)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media (prefers-reduced-motion:reduce){#tap .food,.dnext{animation:none}}
</style>

<div id="app">
  <div class="hud" id="hud" hidden>
    <span id="mname"></span>
    <span class="chip" id="cres"></span>
    <span class="chip">忍住 <b id="cwill">0</b></span>
    <span class="chip">★ <b id="cstar">0</b></span>
    <span class="chip hi" id="cfx" hidden></span>
    <span class="chip hi" id="cq" hidden></span>
    <div class="prog" id="prog" aria-hidden="true"><i id="pbar"></i></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="layer" id="title">
      <h1>小公主的<br>放學路</h1>
      <span class="tag">和小白襪一起，跳過障礙、忍住誘惑！</span>
      <div class="sheet" id="tsheet">
        <div class="two">
          <button class="mcard a" id="tomap"><strong>開始冒險</strong><span>九關地圖</span><em id="hflow"></em></button>
          <button class="mcard b" id="toend"><strong>無盡模式</strong><span>看能跑多遠</span><em id="hend"></em></button>
          <button class="mcard c" id="tocamp"><strong>森林營地</strong><span>砍樹切肉賣錢</span><em id="hcamp"></em></button>
        </div>
        <div class="row">
          <button class="btn" id="toshop">衣櫃與能力</button>
          <button class="btn alt" id="tobook">任務與徽章</button>
          <span class="chip">★ <b id="wallet0">0</b></span>
          <button class="btn alt" id="snd" aria-pressed="true">聲音 開</button>
        </div>
        <span class="hint">點畫面或按空白鍵跳躍，空中再點一次二段跳。鴿子飛來時不要跳！</span>
      </div>
    </div>

    <div class="layer panel" id="map" hidden>
      <div class="phead"><h2>冒險地圖</h2><span class="chip">小花 <b id="mflow">0</b> / 27</span><button class="btn alt" data-home>回首頁</button></div>
      <span class="hint">過關拿小花，小花夠多才會開下一關。全部忍住沒亂花，就有三朵。</span>
      <div class="levels" id="levels"></div>
    </div>

    <div class="layer" id="dialog" hidden>
      <div class="dbox" id="dbox">
        <span class="dname" id="dname"></span>
        <div class="dtext" id="dtext"></div>
        <div class="choices" id="choices" hidden></div>
        <span class="dnext" id="dnext">點一下繼續 ▼</span>
      </div>
    </div>

    <div class="layer" id="tap" hidden>
      <div class="food" id="tfood"></div>
      <h2>快連點，忍住！</h2>
      <div class="bar"><i id="twill"></i></div>
      <button id="tapbtn">忍住</button>
      <div class="bar time"><i id="ttime"></i></div>
      <p>時間條跑完前把忍耐力點滿</p>
    </div>

    <div class="layer" id="quiz" hidden>
      <h2 id="qhead"></h2>
      <div id="qshow" hidden></div>
      <div id="qtrack" hidden><div id="qzone"></div><div id="qptr"></div></div>
      <div class="choices" id="qopts"></div>
      <div class="bar time" id="qtimebar"><i id="qtime"></i></div>
    </div>

    <div class="layer panel" id="shop" hidden>
      <div class="wtop">
        <canvas id="pv" width="300" height="340"></canvas>
        <div class="info">
          <h2>衣櫃與能力</h2>
          <span class="chip">我的星星 ★ <b id="wallet1">0</b></span>
          <span class="chip hi">金幣 <b id="wcoin">0</b></span>
          <span class="hint" id="wmsg">用路上撿到的星星換造型、練能力。</span>
          <button class="btn" data-home>好了</button>
        </div>
      </div>
      <div id="shopbody"></div>
    </div>

    <div class="layer panel" id="book" hidden>
      <div class="phead"><h2>任務與徽章</h2><span class="chip">★ <b id="wallet2">0</b></span><button class="btn alt" data-home>回首頁</button></div>
      <h3>今日任務（每天換新）</h3>
      <div class="list" id="daily"></div>
      <h3 id="bcount">徽章蒐集冊</h3>
      <div class="badges" id="badges"></div>
    </div>

    <div class="layer" id="camp" hidden>
      <div class="ctop">
        <span class="chip">🪵 <b id="cwood">0</b></span><span class="chip">🍖 <b id="cmeat">0</b></span>
        <span class="chip" id="cbagc">背包 <b id="cbag">0</b></span><span class="chip" id="cstac">體力 <b id="csta">0</b></span>
        <span class="chip hi">金幣 <b id="ccoin">0</b></span>
      </div>
      <div class="csheet panel">
        <div class="row"><button class="btn" id="csell">全部賣掉</button><button class="btn alt" id="ceat">烤肉吃</button><button class="btn alt" data-home>回首頁</button></div>
        <span class="hint" id="cmsg">點樹砍木頭、點肉攤切肉。賣掉換金幣，交訂單換星星。</span>
        <h3>訂單</h3><div class="list" id="corders"></div>
        <h3>裝備</h3><div class="list" id="cequip"></div>
      </div>
    </div>

    <div class="layer panel" id="result" hidden>
      <span id="rending" hidden></span>
      <h2 id="rtitle"></h2>
      <div class="rate" id="rrate"></div>
      <p id="rtext"></p>
      <div class="stats" id="rstats"></div>
      <p id="rnew" class="hint" hidden></p>
      <div class="row" style="justify-content:center">
        <button class="btn" id="rnext">下一關</button>
        <button class="btn alt" id="ragain">再玩一次</button>
        <button class="btn alt" id="rmap">地圖</button>
        <button class="btn alt" data-home>回首頁</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const HAIR='#1f1a24',SKIN='#ffdcc6';
const FONT='"LXGW WenKai TC","PingFang TC","Microsoft JhengHei",sans-serif';
const rnd=Math.random;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- data ---------- */
const SHOP={
  hair:{label:'頭飾',items:[{id:'none',name:'愛心髮夾',cost:0},{id:'bow',name:'蝴蝶結',cost:20,fx:'忍住少點 1 下'},{id:'cat',name:'貓耳朵',cost:40,fx:'二段跳更高'},{id:'crown',name:'皇冠',cost:80,fx:'星星收入 +20%'},
    {id:'wreath',name:'花環',cost:35},{id:'bunny',name:'兔耳朵',cost:45},{id:'beret',name:'貝雷帽',cost:40},{id:'beanie',name:'毛線帽',cost:60,coin:true}]},
  face:{label:'眼鏡',items:[{id:'none',name:'不戴',cost:0},{id:'round',name:'圓框眼鏡',cost:25},{id:'sun',name:'太陽眼鏡',cost:40},{id:'heart',name:'愛心墨鏡',cost:80,coin:true}]},
  neck:{label:'脖子',items:[{id:'none',name:'不戴',cost:0},{id:'scarf',name:'紅圍巾',cost:25},{id:'pearl',name:'珍珠項鍊',cost:45},{id:'cape',name:'小披風',cost:120,coin:true}]},
  back:{label:'背上',items:[{id:'none',name:'不背',cost:0},{id:'bag',name:'書包',cost:20},{id:'angel',name:'天使翅膀',cost:90},{id:'fly',name:'蝴蝶翅膀',cost:150,coin:true}]},
  top:{label:'上衣',items:[{id:'lav',name:'薰衣草紫',cost:0,color:'#cdbdf2'},{id:'pink',name:'蜜桃粉',cost:15,color:'#ffb3c9'},{id:'mint',name:'薄荷綠',cost:15,color:'#a8e6d1'},{id:'lemon',name:'檸檬黃',cost:15,color:'#ffe58a'},{id:'sky',name:'天空藍',cost:15,color:'#a9d4ff'},{id:'white',name:'牛奶白',cost:20,color:'#f7f3ea'},{id:'coral',name:'珊瑚橘',cost:20,color:'#ffb08a'}]},
  bottom:{label:'下身',items:[{id:'shorts',name:'灰色短褲',cost:0},{id:'skirt',name:'百褶裙',cost:30},{id:'jeans',name:'牛仔褲',cost:30}]},
  hand:{label:'手上拿的',items:[{id:'candy',name:'棉花糖棒',cost:0},{id:'none',name:'空手',cost:0},{id:'balloon',name:'氣球',cost:25},{id:'wand',name:'星星魔法棒',cost:50},{id:'bouquet',name:'花束',cost:35},{id:'umb',name:'小雨傘',cost:40},{id:'axe',name:'小斧頭',cost:50,coin:true}]},
  pet:{label:'小白襪的配件',items:[{id:'none',name:'不戴',cost:0},{id:'bell',name:'鈴鐺項圈',cost:20},{id:'tie',name:'小領結',cost:30},{id:'pcrown',name:'小皇冠',cost:60},{id:'pscarf',name:'小圍巾',cost:25},{id:'phat',name:'小草帽',cost:70,coin:true}]}
};
const UPS=[
  {id:'jump',name:'彈跳力',d:'每級跳得更高一點',cost:[30,60,100]},
  {id:'will',name:'忍耐力',d:'每級忍住時少點 2 下',cost:[40,80,120]},
  {id:'guard',name:'護身符',d:'每級每趟多擋 1 次撞擊',cost:[60,120]},
  {id:'magnet',name:'星星手',d:'每級撿星星的範圍變大',cost:[30,60,90]}
];

let ac=null;
function beep(f,d,type,vol){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),gn=ac.createGain();
    o.type=type||'square';o.frequency.value=f;gn.gain.value=vol||0.05;
    gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);
    o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

const MIX={def:[['cone',28],['box',22],['puddle',18],['dog',17],['bird',15]],animals:[['cone',14],['box',10],['puddle',10],['dog',36],['bird',30]],puddles:[['cone',15],['box',12],['puddle',48],['dog',12],['bird',13]]};
const OB={cone:{w:26,h:34},box:{w:40,h:40},puddle:{w:72,h:8},dog:{w:36,h:28},bird:{w:34,h:26,fy:108}};
function pick(mix){let r=rnd()*100;for(const p of mix){r-=p[1];if(r<0)return p[0];}return mix[0][0];}
function addObs(e,x0,x1,avoid,gmin,grand,mix){
  let x=x0,prev=x0-200;
  while(x<x1){
    if(!avoid.some(function(s){return Math.abs(x-s)<270;})){
      const k=pick(MIX[mix||'def']),o=OB[k];
      e.push({type:'ob',x:x,k:k,w:o.w,h:o.h,fy:o.fy});
      if(k==='bird')for(let j=-1;j<=1;j++)e.push({type:'star',x:x+17+j*38,h:34});
      else e.push({type:'star',x:x-44,h:62},{type:'star',x:x+o.w/2,h:104},{type:'star',x:x+o.w+44,h:62});
      if(x-prev>300){const mid=(x+prev)/2;
        if(rnd()<0.13)e.push({type:'item',x:mid,h:46,k:['board','umb','mag'][Math.floor(rnd()*3)]});
        else{const hi=rnd()<0.3;for(let j=-1;j<=1;j++)e.push({type:'star',x:mid+j*38,h:hi?168:34});}}
      prev=x+o.w;
    }
    x+=gmin+rnd()*grand;
  }
}
function makeLevel(lv){
  const e=[],kinds=[];
  for(let i=0;i<lv.stalls;i++)kinds.push('stall');
  for(let i=0;i<lv.mates;i++)kinds.push('mate');
  for(let i=0;i<lv.npcs;i++)kinds.push('npc');
  kinds.push('mom');
  const order=shuffle(kinds),ts=shuffle(TEMPT),ms=shuffle(MATES),qs=shuffle(QUESTS),xs=[];
  let a=0,b=0,q=0;
  order.forEach(function(k,i){
    const x=lv.len*(i+1)/(order.length+1);xs.push(x);
    if(k==='stall')e.push({type:'stall',x:x,tm:ts[a++%ts.length]});
    else if(k==='mate')e.push({type:'mate',x:x,tm:ms[b++%ms.length]});
    else if(k==='npc')e.push({type:'npc',x:x,q:qs[q++%qs.length]});
    else e.push({type:'mom',x:x});
  });
  addObs(e,700,lv.len-450,xs,lv.gap[0],lv.gap[1],lv.mix);
  e.push({type:'goal',x:lv.len});
  return e;
}
function extend(){
  while(g.genX<g.camX+W+1500){
    const x0=g.genX,x1=x0+1250,ex=x0+625,r=rnd(),avoid=[];
    if(x0>600){
      avoid.push(ex);
      if(r<0.5)g.ents.push({type:'stall',x:ex,tm:TEMPT[Math.floor(rnd()*TEMPT.length)]});
      else if(r<0.78)g.ents.push({type:'mate',x:ex,tm:MATES[Math.floor(rnd()*MATES.length)]});
      else if(r<0.93)g.ents.push({type:'npc',x:ex,q:QUESTS[Math.floor(rnd()*QUESTS.length)]});
      else g.ents.push({type:'mom',x:ex});
    }
    addObs(g.ents,x0+(x0?0:700),x1,avoid,Math.max(250,370-x0/260),220,'def');
    g.genX=x1;
  }
  if(g.ents.length>400)g.ents=g.ents.filter(function(e){return e.x>g.camX-400;});
}

  opts=opts||{};

  const el=$('dtext');let i=0;
  const me=dq={done:false,next:opts.next,choices:opts.choices,timer:null};
  me.fin=function(){clearInterval(me.timer);el.textContent=text;me.done=true;
    if(me.choices){const box=$('choices');me.choices.forEach(function(ch){const b=document.createElement('button');b.textContent=ch.label;

function mathQ(){

/* ---------- loop ---------- */
function update(dt){
  const lv=g.lv,endless=lv.type==='endless',prog=endless?0:g.camX/lv.len;
  g.stun=Math.max(0,g.stun-dt);g.inv=Math.max(0,g.inv-dt);g.boost=Math.max(0,g.boost-dt);g.magnet=Math.max(0,g.magnet-dt);
  let v=endless?240+Math.min(220,g.camX/140):lv.sp[0]+lv.sp[1]*prog;
  if(g.boost>0)v*=1.55;if(g.quest&&g.quest.def.fast)v*=1.35;if(g.stun>0)v*=0.25;
  g.camX+=v*dt;
  if(g.py>0||g.vy>0){g.vy-=1900*dt;g.py+=g.vy*dt;if(g.py<=0){g.py=0;g.vy=0;g.jumps=0;}}
  g.ph.push(g.py);if(g.ph.length>9)g.ph.shift();
  if(endless)extend();
  const px=g.camX+PX,mag=S.up.magnet;
  for(const e of g.ents){
    if(e.k==='dog'&&e.type==='ob'&&e.x-px<420&&e.x-px>-120)e.x-=95*dt;
    const d=e.x-px;if(d<-140||d>280)continue;
    if(e.type==='star'){
      if(e.got)continue;
      const near=Math.abs(d)<24+6*mag&&Math.abs(e.h-(g.py+40))<46+8*mag;
      const pull=g.magnet>0&&d<150&&d>-40;
      const pet=Math.abs(d+40)<18&&Math.abs(e.h-(g.ph[0]*0.8+16))<32;
      if(near||pull||pet){e.got=true;g.stars++;beep(1040,0.06,'triangle',0.04);pop(e.x,e.h+10,(!near&&pet)?'喵 +1':'+1','#e0a21a',0.5);}
    }
    else if(e.type==='item'){if(!e.got&&Math.abs(d)<30&&Math.abs(e.h-(g.py+40))<60){e.got=true;takeItem(e.k,px);}}
    else if(e.type==='ob'){
      if(e.dead||!(px+10>e.x&&px-10<e.x+e.w&&(e.fy?(g.py+90>e.fy&&g.py<e.fy+e.h):g.py<e.h-4)))continue;
      if(g.boost>0){e.dead=true;g.stars+=2;pop(e.x,70,'撞飛！+2','#e0a21a',0.6);beep(220,0.08);}
      else if(g.inv<=0){hitOb(px,e);if(endless&&g.hp<=0){finishEndless();return;}}
    }
    else if(e.type==='qitem'){if(!e.got&&g.quest&&Math.abs(d)<30&&(e.goal||Math.abs(qh(e)-(g.py+40))<56)){gotItem(e);if(g.mode!=='run')return;}}
    else if(e.done||d>=150)continue;
    else if(e.type==='stall'){meetStall(e);return;}
    else if(e.type==='mate'){meetMate(e);return;}
    else if(e.type==='npc'){meetNpc(e);return;}
    else if(e.type==='mom'){meetMom(e);return;}
    else if(e.type==='goal'&&d<40){
      e.done=true;
      if(lv.type==='money'){const ok=g.money>=lv.keep;finish(ok,ok?(g.bought?'東西買齊了，不過路上還是偷花了一點錢。全部忍住才有三朵花！':'一塊錢都沒亂花，任務漂亮完成！'):'到了才發現錢不夠 '+(lv.keep-g.money)+' 元。再挑戰一次，這次把錢顧好！');}
      else finish(true,g.bought?'趕上了！不過路上還是被誘惑了，全部忍住才有三朵花。':'準時到，而且一次都沒有被誘惑！');
      return;
    }
  }
  if(g.quest&&px>g.quest.endX)dropQuest('沒趕上，下次再幫忙',px);
  if(lv.type==='time'){g.time+=dt;if(g.time>=g.limit){finish(false,'5:00 的鐘聲響了，還沒走到。少撞一點障礙、忍住誘惑就來得及！');return;}}
  hud();
}
let last=0;
function frame(ts){
  const dt=Math.min(0.033,(ts-last)/1000||0);last=ts;g.t+=dt;
  if(g.faceT>0){g.faceT-=dt;if(g.faceT<=0&&g.mode!=='end')g.face='happy';}
  if(!g.lv){
    if(!reduce)g.camX+=70*dt;
    g.lift=g.mode==='title'?Math.max(0,$('tsheet').offsetHeight/scale-40):0;
  }else if(g.mode==='run')update(dt);
  else if(g.mode==='quiz'){
    const t=qz.timing;
    if(t){t.pos+=t.dir*t.speed*dt;if(t.pos>1){t.pos=1;t.dir=-1;}if(t.pos<0){t.pos=0;t.dir=1;}$('qptr').style.left=(t.pos*100)+'%';}
    if(qz.total>0){qz.left-=dt;$('qtime').style.width=Math.max(0,qz.left/qz.total*100)+'%';
      if(qz.left<=0){qz.total=0;const f=qz.onTimeout;if(f)f();}}
  }
  else if(g.mode==='tap'){
    tp.left-=dt;$('ttime').style.width=Math.max(0,tp.left/tp.total*100)+'%';
    if(tp.left<=0&&tp.n<tp.need)buy(tp.tm,true);
  }
  for(const p of g.fx){p.life-=dt;p.h+=40*dt;}
  if(g.fx.length)g.fx=g.fx.filter(function(p){return p.life>0;});
  if(g.mode==='camp'){campTick(dt);drawCamp();}else drawWorld();
  requestAnimationFrame(frame);
}

const EQ=[
  {id:'axe',name:'斧頭',d:'每砍一下多 1 個木頭',cost:[15,40,90,180]},
  {id:'knife',name:'菜刀',d:'每切一下多 1 塊肉',cost:[15,40,90,180]},
  {id:'bag',name:'背包',d:'多裝 10 個東西',cost:[20,50,100,180,300]},
  {id:'fire',name:'營火',d:'體力上限 +10、恢復更快，還會多一棵樹或一個肉攤',cost:[60,150,300]},
  {id:'cat',name:'小白襪幫手',d:'小白襪自己幫忙撿，不花體力',cost:[50,120,250]}
];
const CATRATE=[0,6,4,2.5];
const camp={nodes:[],gx:180,tx:180,fx:[],catT:0,saveT:0,chop:0};
function staMax(){return 40+10*S.camp.eq.fire;}
function bagCap(){return 20+10*S.camp.eq.bag;}
function held(){return S.camp.wood+S.camp.meat;}
function staTick(){
  const c=S.camp,max=staMax(),per=[5,4,3,2.5][c.eq.fire]*1000,now=Date.now();
  if(c.sta>=max||!c.staT){c.staT=now;return;}
  const n=Math.floor((now-c.staT)/per);if(n>0){c.sta=Math.min(max,c.sta+n);c.staT+=n*per;}
}
function newOrder(){
  const c=S.camp,k=1+0.3*(c.eq.axe+c.eq.knife)+Math.min(1,c.done*0.05),r=rnd();
  let w=r<0.2?0:Math.round(ri(6,14)*k),m=r>0.8?0:Math.round(ri(3,8)*k);
  const cap=bagCap();if(w+m>cap){const f=cap/(w+m);w=Math.floor(w*f);m=Math.floor(m*f);}
  if(w+m<=0)w=5;
  const v=w+2*m;
  return {who:['王奶奶','陳伯伯','林阿姨','雜貨店老闆娘','李叔叔','警衛叔叔'][ri(0,5)],w:w,m:m,star:Math.round(v/2.5)+4,coin:Math.round(v*0.3)+2};
}
function campNodes(){
  const f=S.camp.eq.fire,n=[{t:'tree',fx:0.1},{t:'tree',fx:0.3},{t:'meat',fx:0.72}];
  if(f>=1)n.push({t:'tree',fx:0.92});
  if(f>=2)n.push({t:'meat',fx:0.52});
  n.forEach(function(o){o.max=o.t==='tree'?5:4;o.hp=o.max;o.down=0;o.shake=0;});
  camp.nodes=n;
}
function cmsg(t){$('cmsg').textContent=t;}
function cpop(x,y,txt,col){camp.fx.push({x:x,y:y,txt:txt,col:col||'#3b2a4d',life:0.9});}
function campUI(){
  const c=S.camp;
  $('cwood').textContent=c.wood;$('cmeat').textContent=c.meat;$('ccoin').textContent=c.coin;
  $('cbag').textContent=held()+' / '+bagCap();$('cbagc').classList.toggle('warn',held()>=bagCap());
  $('csta').textContent=c.sta+' / '+staMax();$('cstac').classList.toggle('warn',c.sta<=0);
  const ro=$('corders');ro.innerHTML='';
  c.orders.forEach(function(o,i){
    const row=document.createElement('div');row.className='line';
    row.innerHTML='<div class="tx"><b></b><span></span></div>';
    row.querySelector('b').textContent=o.who+'要 '+(o.w?'🪵 '+o.w+' ':'')+(o.m?'🍖 '+o.m:'');
    row.querySelector('span').textContent='報酬 ★ '+o.star+'、金幣 '+o.coin;
    const b=document.createElement('button');b.className='btn';b.id='ord-'+i;b.textContent='交貨';
    b.disabled=c.wood<o.w||c.meat<o.m;
    b.addEventListener('click',function(){
      c.wood-=o.w;c.meat-=o.m;S.stars+=o.star;c.coin+=o.coin;c.done++;c.orders[i]=newOrder();
      beep(988,0.12,'triangle');setTimeout(function(){beep(1319,0.2,'triangle');},110);
      cmsg(o.who+'：「謝謝妳！」拿到 ★ '+o.star+'、金幣 '+o.coin+'。');newBadges();save();campUI();
    });
    row.appendChild(b);ro.appendChild(row);
  });
  const re=$('cequip');re.innerHTML='';
  EQ.forEach(function(u){
    const lvl=c.eq[u.id],max=u.cost.length,row=document.createElement('div');row.className='line';
    row.innerHTML='<div class="tx"><b></b><span></span></div><span class="pips">'+'●'.repeat(lvl)+'○'.repeat(max-lvl)+'</span>';
    row.querySelector('b').textContent=u.name;row.querySelector('.tx span').textContent=u.d;
    const b=document.createElement('button');b.className='btn';b.id='eq-'+u.id;
    if(lvl>=max){b.textContent='已滿級';b.disabled=true;}
    else{b.textContent='金幣 '+u.cost[lvl];
      b.addEventListener('click',function(){
        if(c.coin<u.cost[lvl]){cmsg('金幣還差 '+(u.cost[lvl]-c.coin)+' 個，多賣一點東西吧！');b.classList.remove('no-go');void b.offsetWidth;b.classList.add('no-go');beep(180,0.15,'sawtooth');return;}
        c.coin-=u.cost[lvl];c.eq[u.id]++;beep(988,0.15,'triangle');cmsg('「'+u.name+'」升級了！');
        if(u.id==='fire'){const old=camp.nodes;campNodes();old.forEach(function(o,j){if(camp.nodes[j]){camp.nodes[j].hp=o.hp;camp.nodes[j].down=o.down;}});}
        newBadges();save();campUI();
      });}
    row.appendChild(b);re.appendChild(row);
  });
}
function openCamp(){
  idle('camp','camp');
  const c=S.camp,now=Date.now();
  if(!c.staT){c.staT=now;c.sta=staMax();}
  staTick();
  while(c.orders.length<3)c.orders.push(newOrder());
  campNodes();camp.gx=camp.tx=W*0.5;camp.fx=[];
  cmsg('點樹砍木頭、點肉攤切肉。賣掉換金幣，交訂單換星星。');
  if(c.eq.cat&&c.seen){
    let n=Math.floor(Math.min(1200,(now-c.seen)/1000)/CATRATE[c.eq.cat]);n=Math.max(0,Math.min(n,bagCap()-held()));
    if(n>0){const w=Math.round(n*0.6);c.wood+=w;c.meat+=n-w;c.tw+=w;cmsg('小白襪趁妳不在，幫忙撿了 '+n+' 個東西。');}
  }
  c.seen=now;save();campUI();
}
function campTap(e){
  const r=stage.getBoundingClientRect(),lx=(e.clientX-r.left)/scale,ly=(e.clientY-r.top)/scale,cg=Hl*0.38;
  if(ly<cg-140||ly>cg+28)return;
  let best=null,bd=36;
  camp.nodes.forEach(function(n){const d=Math.abs(lx-n.fx*W);if(d<bd){bd=d;best=n;}});
  if(best){e.preventDefault();chop(best);}
}
function chop(n){
  const c=S.camp,x=n.fx*W,cg=Hl*0.38;
  camp.tx=Math.max(26,x-44);
  if(n.down>0){cmsg(n.t==='tree'?'這棵樹還在長，等一下。':'肉攤補貨中，等一下。');return;}
  if(c.sta<=0){cmsg('沒體力了。烤肉吃可以補體力，去跑一關也會補滿。');cpop(x,cg-120,'沒體力','#c2506a');beep(180,0.12,'sawtooth');return;}
  if(held()>=bagCap()){cmsg('背包滿了！先賣掉或交訂單。');cpop(x,cg-120,'背包滿了','#c2506a');beep(180,0.12,'sawtooth');return;}
  const tree=n.t==='tree',amt=Math.min(1+(tree?c.eq.axe:c.eq.knife),bagCap()-held());
  c.sta--;if(tree){c.wood+=amt;c.tw+=amt;}else c.meat+=amt;
  n.hp--;n.shake=0.18;camp.chop=0.18;
  cpop(x,cg-120,(tree?'🪵 +':'🍖 +')+amt);beep(tree?240:330,0.06);
  if(n.hp<=0){n.down=tree?5:4;beep(140,0.18,'sawtooth');}
  campUI();
}
$('csell').addEventListener('click',function(){
  const c=S.camp,gain=c.wood+c.meat*2;
  if(!gain){cmsg('背包是空的，先去砍樹切肉。');return;}
  c.coin+=gain;cmsg('賣掉 🪵 '+c.wood+'、🍖 '+c.meat+'，賺到金幣 '+gain+'。');c.wood=0;c.meat=0;
  beep(880,0.1,'triangle');setTimeout(function(){beep(1175,0.15,'triangle');},90);save();campUI();
});
$('ceat').addEventListener('click',function(){
  const c=S.camp;
  if(c.meat<3){cmsg('烤肉要 3 塊肉，可以補 12 點體力。');return;}
  if(c.sta>=staMax()){cmsg('體力是滿的，先不用吃。');return;}
  c.meat-=3;c.sta=Math.min(staMax(),c.sta+12);cmsg('在營火上烤肉吃，體力 +12！');beep(660,0.12,'triangle');save();campUI();
});
function campTick(dt){
  const c=S.camp,before=c.sta;
  staTick();if(c.sta!==before)campUI();
  camp.chop=Math.max(0,camp.chop-dt);
  camp.nodes.forEach(function(n){n.shake=Math.max(0,n.shake-dt);if(n.down>0){n.down-=dt;if(n.down<=0){n.down=0;n.hp=n.max;}}});
  camp.gx+=(camp.tx-camp.gx)*Math.min(1,dt*9);
  if(c.eq.cat){camp.catT+=dt;if(camp.catT>=CATRATE[c.eq.cat]){camp.catT=0;
    if(held()<bagCap()){const tree=rnd()<0.6;if(tree){c.wood++;c.tw++;}else c.meat++;cpop(W*0.5-44,Hl*0.38+8,tree?'喵 🪵 +1':'喵 🍖 +1','#8a6a48');campUI();}}}
  for(const p of camp.fx){p.life-=dt;p.y-=34*dt;}
  if(camp.fx.length)camp.fx=camp.fx.filter(function(p){return p.life>0;});
  camp.saveT+=dt;if(camp.saveT>5){camp.saveT=0;c.seen=Date.now();save();}
}
function drawCamp(){
  const c=ctx,cg=Hl*0.38,t=g.t;
  c.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  const sk=c.createLinearGradient(0,0,0,cg);sk.addColorStop(0,'#bfe1f4');sk.addColorStop(1,'#f1fafe');
  c.fillStyle=sk;c.fillRect(0,0,W,Hl);
  c.fillStyle='#e3f1f9';c.beginPath();c.ellipse(W*0.25,cg-10,W*0.5,70,0,0,7);c.ellipse(W*0.85,cg-6,W*0.45,54,0,0,7);c.fill();
  for(let i=0;i<9;i++){const x=hash(i+3)*W,h=30+hash(i+20)*26,y=cg-34+hash(i+7)*14;
    c.fillStyle='#8fbfa6';c.beginPath();c.moveTo(x,y-h);c.lineTo(x+h*0.34,y);c.lineTo(x-h*0.34,y);c.closePath();c.fill();}
  c.fillStyle='#f6fbfe';c.fillRect(0,cg-22,W,Hl);
  c.fillStyle='rgba(120,160,190,.16)';c.beginPath();c.ellipse(W*0.5,cg+52,W*0.34,20,0,0,7);c.fill();
  c.textAlign='center';c.textBaseline='middle';
  camp.nodes.forEach(function(n){
    const x=n.fx*W+(n.shake>0?Math.sin(t*70)*3:0);
    if(n.t==='tree'){
      if(n.down>0){c.fillStyle='#8a6a48';rr(c,x-9,cg-12,18,12,3);c.fill();c.fillStyle='#c79a62';c.beginPath();c.ellipse(x,cg-12,9,3.5,0,0,7);c.fill();
        c.fillStyle='#7a6a8c';c.font='800 12px sans-serif';c.fillText(Math.ceil(n.down)+' 秒',x,cg-28);return;}
      c.fillStyle='#8a6a48';c.fillRect(x-6,cg-30,12,30);
      [[36,-28,-72],[29,-54,-94],[21,-78,-114]].forEach(function(q){c.fillStyle='#3f9a72';c.beginPath();c.moveTo(x,cg+q[2]);c.lineTo(x+q[0]/2,cg+q[1]);c.lineTo(x-q[0]/2,cg+q[1]);c.closePath();c.fill();
        c.fillStyle='#fff';c.beginPath();c.moveTo(x,cg+q[2]);c.lineTo(x+q[0]*0.2,cg+q[2]+14);c.lineTo(x,cg+q[2]+10);c.lineTo(x-q[0]*0.2,cg+q[2]+14);c.closePath();c.fill();});
    }else{
      c.fillStyle='#8a6a48';c.fillRect(x-24,cg-22,5,22);c.fillRect(x+19,cg-22,5,22);
      c.fillStyle='#c79a62';rr(c,x-30,cg-30,60,9,3);c.fill();
      if(n.down>0){c.fillStyle='#7a6a8c';c.font='800 12px sans-serif';c.fillText('補貨 '+Math.ceil(n.down)+' 秒',x,cg-44);return;}
      c.font=(26+n.hp*3)+'px sans-serif';c.fillStyle='#3b2a4d';c.fillText('🍖',x,cg-50);
    }
    c.fillStyle='rgba(59,42,77,.25)';rr(c,x-16,cg-132,32,5,2.5);c.fill();
    c.fillStyle=n.t==='tree'?'#5fbf8a':'#ff8fb3';rr(c,x-16,cg-132,32*n.hp/n.max,5,2.5);c.fill();
  });
  const fx=W*0.5,fy=cg+50,fl=S.camp.eq.fire;
  c.fillStyle='rgba(255,170,60,.18)';c.beginPath();c.arc(fx,fy-12,34+fl*5+Math.sin(t*7)*3,0,7);c.fill();
  c.strokeStyle='#7a5a3c';c.lineWidth=6;c.lineCap='round';line(c,fx-16,fy,fx+16,fy-7);line(c,fx-16,fy-7,fx+16,fy);
  const fh=22+fl*5+Math.sin(t*11)*3;
  c.fillStyle='#ff8a3d';c.beginPath();c.moveTo(fx-11,fy-6);c.quadraticCurveTo(fx-14,fy-fh*0.6,fx+Math.sin(t*9)*3,fy-fh-6);c.quadraticCurveTo(fx+14,fy-fh*0.6,fx+11,fy-6);c.closePath();c.fill();
  c.fillStyle='#ffd35c';c.beginPath();c.moveTo(fx-6,fy-6);c.quadraticCurveTo(fx-7,fy-fh*0.4,fx,fy-fh*0.7);c.quadraticCurveTo(fx+7,fy-fh*0.4,fx+6,fy-6);c.closePath();c.fill();
  drawCat(c,fx-50,fy+6,1,t,false,S.fit.pet);
  const moving=Math.abs(camp.tx-camp.gx)>3;
  c.fillStyle='rgba(59,42,77,.14)';c.beginPath();c.ellipse(camp.gx,cg+9,16,4,0,0,7);c.fill();
  c.save();if(camp.chop>0){c.translate(camp.gx,cg+6);c.rotate(0.12);c.translate(-camp.gx,-cg-6);}
  drawGirl(c,camp.gx,cg+6,0.78,S.fit,t,{run:moving,air:false,face:'happy'});c.restore();
  c.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<22;i++){const x=(hash(i+60)*W+Math.sin(t+i)*10)%W,y=(hash(i+90)*Hl+t*(18+hash(i)*22))%(cg+60);c.beginPath();c.arc(x,y,1.6,0,7);c.fill();}
  for(const p of camp.fx){c.globalAlpha=Math.max(0,Math.min(1,p.life*2));c.fillStyle=p.col;c.font='800 15px sans-serif';c.fillText(p.txt,p.x,p.y);c.globalAlpha=1;}
}

function wallets(){['wallet0','wallet1','wallet2'].forEach(function(i){$(i).textContent=S.stars;});$('wcoin').textContent=S.camp.coin;}
function idle(mode,layer){g.mode=mode;g.lv=null;g.py=0;g.ph=[0];g.face='happy';g.fx=[];g.boost=0;g.shield=0;g.inv=0;$('hud').hidden=true;show(layer);wallets();requestAnimationFrame(resize);}
function home(){
  idle('title','title');
  $('hflow').textContent='✿ '+flowers()+' / 27';
  $('hend').textContent=S.endless?S.endless+' 公尺':'未挑戰';

function openMap(){
  idle('menu','map');
  const fl=flowers();$('mflow').textContent=fl;
  const root=$('levels');root.innerHTML='';
  LEVELS.forEach(function(lv,i){
    const open=fl>=lv.need,b=S.best[lv.id]||0;

    el.innerHTML='<span class="no">第 '+(i+1)+' 關・'+(lv.type==='time'?'趕時間':'顧好錢')+'</span><strong></strong><span></span>'+
      (open?'<span class="fl">'+'✿'.repeat(b)+'<s>'+'✿'.repeat(3-b)+'</s></span>':'<span>需要 '+lv.need+' 朵小花</span>');

function nope(b,msg){$('wmsg').textContent=msg;b.classList.remove('no-go');void b.offsetWidth;b.classList.add('no-go');beep(180,0.15,'sawtooth');}
function openShop(){
  idle('menu','shop');
  const root=$('shopbody');root.innerHTML='';
  const h=document.createElement('h3');h.textContent='能力升級';root.appendChild(h);
  const list=document.createElement('div');list.className='list';
  UPS.forEach(function(u){
    const lvl=S.up[u.id],max=u.cost.length,row=document.createElement('div');row.className='line';
    row.innerHTML='<div class="tx"><b></b><span></span></div><span class="pips">'+'●'.repeat(lvl)+'○'.repeat(max-lvl)+'</span>';
    row.querySelector('b').textContent=u.name;row.querySelector('.tx span').textContent=u.d;
    const b=document.createElement('button');b.className='btn';b.id='up-'+u.id;
    if(lvl>=max){b.textContent='已滿級';b.disabled=true;}
    else{b.textContent='★ '+u.cost[lvl];
      b.addEventListener('click',function(){
        if(S.stars<u.cost[lvl]){nope(b,'星星還差 '+(u.cost[lvl]-S.stars)+' 顆，再去跑一趟吧！');return;}
        S.stars-=u.cost[lvl];S.up[u.id]++;save();beep(988,0.15,'triangle');openShop();$('wmsg').textContent='「'+u.name+'」升級了！';});}
    row.appendChild(b);list.appendChild(row);
  });
  root.appendChild(list);
  Object.keys(SHOP).forEach(function(c){
    const h3=document.createElement('h3');h3.textContent=SHOP[c].label;root.appendChild(h3);
    const grid=document.createElement('div');grid.className='items';
    SHOP[c].items.forEach(function(it){
      const own=owns(c,it),on=S.fit[c]===it.id;
      const b=document.createElement('button');b.className='item'+(on?' on':'')+(own?'':' lock');b.id='it-'+c+'-'+it.id;
      const nm=document.createElement('span');nm.textContent=it.name;
      const sm=document.createElement('small');sm.textContent=(on?'穿著中':own?'已擁有':(it.coin?'金幣 ':'★ ')+it.cost)+(it.fx?'・'+it.fx:'');
      b.appendChild(nm);b.appendChild(sm);
      b.addEventListener('click',function(){
        let msg='換上「'+it.name+'」。';
        if(!owns(c,it)){
          if(it.coin){if(S.camp.coin<it.cost){nope(b,'金幣還差 '+(it.cost-S.camp.coin)+' 個，去森林營地賺吧！');return;}S.camp.coin-=it.cost;}
          else{if(S.stars<it.cost){nope(b,'星星還差 '+(it.cost-S.stars)+' 顆，再去跑一趟吧！');return;}S.stars-=it.cost;}
          S.owned[c+':'+it.id]=1;msg='換到「'+it.name+'」了！';beep(988,0.15,'triangle');
        }
        S.fit[c]=it.id;newBadges();save();openShop();$('wmsg').textContent=msg;
      });
      grid.appendChild(b);
    });
    root.appendChild(grid);
  });
  drawPreview();
}
function openBook(){
  idle('menu','book');newBadges();save();
  const d=daily(),root=$('daily');root.innerHTML='';
  d.ids.forEach(function(id){
    const k=DAILY.find(function(x){return x.id===id;}),n=Math.min(k.n,d.c[id]||0),ok=n>=k.n,got=!!d.claimed[id];
    const row=document.createElement('div');row.className='line';
    row.innerHTML='<div class="tx"><b></b><span></span></div>';
    row.querySelector('b').textContent=k.t;row.querySelector('span').textContent='進度 '+n+' / '+k.n;
    const b=document.createElement('button');b.className='btn';b.id='dq-'+id;
    b.textContent=got?'已領取':ok?'領取 ★ '+k.r:'★ '+k.r;b.disabled=got||!ok;
    b.addEventListener('click',function(){d.claimed[id]=1;S.stars+=k.r;save();beep(988,0.15,'triangle');openBook();});
    row.appendChild(b);root.appendChild(row);
  });
  const bg=$('badges');bg.innerHTML='';let have=0;
  BADGES.forEach(function(b){
    const on=!!S.badges[b.id];if(on)have++;
    const el=document.createElement('div');el.className='badge'+(on?'':' off');
    el.innerHTML='<i></i><b></b><span></span>';
    el.querySelector('i').textContent=b.ic;el.querySelector('b').textContent=b.name;el.querySelector('span').textContent=b.d;
    bg.appendChild(el);
  });
  $('bcount').textContent='徽章蒐集冊（'+have+' / '+BADGES.length+'）';
}
